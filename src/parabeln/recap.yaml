# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: "Vier Bausteine, die du für Parabeln und Potenzfunktionen brauchst: lineare Funktionen, binomische Formeln, Potenzgesetze und die Darstellungen einer Funktion."
recap:
  [
    mathematik/lineare-funktionen,
    mathematik/klammern-binome,
    mathematik/potenzgesetze,
    mathematik/funktionen-darstellung,
  ]
blocks:
  - type: section
    id: kopf
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text: |
          Das brauchst du für dieses Kapitel: lineare Funktionen, Klammern und binomische Formeln, Potenzgesetze und
          die Darstellungen einer Funktion. Zu jedem Baustein steht eine kurze Auffrischung und ein Kurztest. Er zeigt
          dir sofort, ob du es kannst. Es wird nichts gezählt und nichts gespeichert.
  - type: section
    id: lineare-funktionen
    title: Lineare Funktionen
    blocks:
      - type: text
        text: |
          Eine **lineare Funktion** hat den Term $f(x) = m \cdot x + b$. Die **Steigung** $m$ sagt, um wie viel
          $f(x)$ größer wird, wenn $x$ um 1 wächst. Der **Achsenabschnitt** $b$ ist der Wert bei $x = 0$: Dort
          schneidet der Graph die y-Achse.
      - type: example
        title: f(x) = 2x − 3
        blocks:
          - type: text
            text: |
              Bei $x = 0$ ist $f(0) = −3$, bei $x = 1$ ist $f(1) = −1$, bei $x = 4$ ist $f(4) = 5$. Mit jedem Schritt
              nach rechts steigt der Wert um die Steigung 2.
      - type: vue-component
        id: test-lineare-funktionen
        component: Kurztest
        props:
          question: "Eine Gerade geht durch die Punkte (0 | 4) und (3 | −2). Wie lautet ihr Term?"
          options:
            - {
                text: "f(x) = −2x + 4",
                correct: true,
                info: "Der Achsenabschnitt ist 4. Von x = 0 bis x = 3 sinkt der Wert um 6, also um 2 je Schritt: Steigung −2.",
              }
            - {
                text: "f(x) = 2x + 4",
                correct: false,
                info: "Der Wert sinkt von 4 auf −2, die Steigung ist also negativ.",
              }
            - {
                text: "f(x) = −6x + 4",
                correct: false,
                info: "6 ist die Änderung über drei Schritte. Die Steigung gilt für einen Schritt: 6 geteilt durch 3.",
              }
            - { text: "f(x) = −2x − 4", correct: false, info: "Der Achsenabschnitt ist der Wert bei x = 0, also +4." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Eine Gerade geht durch (0 | 4) und (3 | −2). Wie lautet ihr Term? Antwort: f(x) = −2x + 4. Der
          Achsenabschnitt ist 4, der Wert sinkt von x = 0 bis x = 3 um 6, also um 2 je Schritt. Falsch wären
          f(x) = 2x + 4 (Steigung hat das falsche Vorzeichen), f(x) = −6x + 4 (6 ist die Änderung über drei Schritte)
          und f(x) = −2x − 4 (der Achsenabschnitt ist +4).
      - type: text
        text: "Wenn du unsicher warst: Wiederhole den Baustein „Lineare Funktionen“ auf seiner [Kartenseite](https://lernapps.net/apps/map/mathematik/c/lineare-funktionen/)."
      - type: definition
        term: Steigung
        explanation: Die Steigung $m$ einer linearen Funktion sagt, um wie viel der Funktionswert wächst, wenn $x$ um 1 größer wird. Bei $f(x) = 2x - 3$ ist sie 2.
      - type: definition
        term: Achsenabschnitt
        explanation: Der Wert $b$ einer linearen Funktion bei $x = 0$. Dort schneidet der Graph die y-Achse. Bei $f(x) = 2x - 3$ ist er −3.
  - type: section
    id: klammern-binome
    title: Klammern und binomische Formeln
    blocks:
      - type: text
        text: |
          Beim **Klammern auflösen** wird jeder Summand der einen Klammer mit jedem der anderen malgenommen.
          Quadrate von Summen und Differenzen haben einen festen Aufbau, die **binomischen Formeln**:
      - type: formula
        formula: "(a + b)^2 = a^2 + 2ab + b^2"
      - type: formula
        formula: "(a - b)^2 = a^2 - 2ab + b^2"
      - type: example
        title: (x − 3)²
        blocks:
          - type: text
            text: |
              Mit $a = x$ und $b = 3$ ist $(x - 3)^2 = x^2 - 2 \cdot x \cdot 3 + 3^2 = x^2 - 6x + 9$. Der mittlere
              Summand heißt Mittelterm.
      - type: vue-component
        id: test-klammern-binome
        component: Kurztest
        props:
          question: "Welcher Term entsteht beim Ausmultiplizieren von (x − 4)²?"
          options:
            - {
                text: "x² − 8x + 16",
                correct: true,
                info: "x² − 2 · x · 4 + 4²: Der Mittelterm ist −8x, das letzte Glied (−4)² ist +16.",
              }
            - {
                text: "x² − 16",
                correct: false,
                info: "So sieht (x − 4)(x + 4) aus. Beim Quadrat fehlt hier der Mittelterm.",
              }
            - { text: "x² + 16", correct: false, info: "Es fehlt der Mittelterm: (x − 4)² ist nicht x² + 4²." }
            - { text: "x² − 8x − 16", correct: false, info: "Das letzte Glied ist (−4)² = +16, nicht −16." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welcher Term entsteht beim Ausmultiplizieren von (x − 4)²? Antwort: x² − 8x + 16. Es ist
          x² − 2 · x · 4 + 4². Falsch sind x² − 16 (so sieht (x − 4)(x + 4) aus), x² + 16 (der Mittelterm fehlt) und
          x² − 8x − 16 (das letzte Glied ist +16).
      - type: text
        text: "Wenn du unsicher warst: Wiederhole den Baustein „Klammern und binomische Formeln“ auf seiner [Kartenseite](https://lernapps.net/apps/map/mathematik/c/klammern-binome/)."
      - type: definition
        term: Binomische Formeln
        explanation: Drei feste Regeln für Klammern wie $(a + b)^2$. Zum Beispiel ist $(x + 2)^2 = x^2 + 4x + 4$.
  - type: section
    id: potenzgesetze
    title: Potenzgesetze
    blocks:
      - type: text
        text: |
          Eine **Potenz** $a^n$ ist das $n$-fache Produkt von $a$: $a$ heißt **Basis**, $n$ heißt **Exponent**. Für
          dieselbe Basis gelten diese Gesetze:
      - type: formula
        formula: 'a^m \cdot a^n = a^{m+n}'
      - type: formula
        formula: '(a^m)^n = a^{m \cdot n}'
      - type: formula
        formula: '(a \cdot b)^n = a^n \cdot b^n'
      - type: example
        title: 2³ · 2⁴
        blocks:
          - type: text
            text: |
              Es ist $2^3 \cdot 2^4 = 2^{3+4} = 2^7 = 128$. Beim Malnehmen gleicher Basen werden die Exponenten
              addiert.
      - type: vue-component
        id: test-potenzgesetze
        component: Kurztest
        props:
          question: "Was ist (3²)³?"
          options:
            - {
                text: "3⁶ = 729",
                correct: true,
                info: "Eine Potenz wird potenziert: Die Exponenten werden multipliziert, 2 · 3 = 6.",
              }
            - {
                text: "3⁵ = 243",
                correct: false,
                info: "Exponenten addieren gilt beim Malnehmen gleicher Basen (3² · 3³), nicht beim Potenzieren.",
              }
            - {
                text: "3⁸ = 6561",
                correct: false,
                info: "Der Exponent 2 wird nicht hoch 3 genommen. Die Exponenten werden multipliziert.",
              }
            - {
                text: "9⁵ = 59049",
                correct: false,
                info: "3² ist 9, aber dann wird 9 dreimal als Faktor genommen: 9³ = 729.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Was ist (3²)³? Antwort: 3⁶ = 729. Beim Potenzieren einer Potenz werden die Exponenten
          multipliziert: 2 · 3 = 6. Falsch sind 3⁵ (das wäre 3² · 3³), 3⁸ (der Exponent wird nicht potenziert) und
          9⁵ (9³ = 729 wäre richtig).
      - type: text
        text: "Wenn du unsicher warst: Wiederhole den Baustein „Potenzgesetze“ auf seiner [Kartenseite](https://lernapps.net/apps/map/mathematik/c/potenzgesetze/)."
      - type: definition
        term: Potenz
        explanation: Die Kurzschreibweise $a^n$ für $n$ gleiche Faktoren $a$. Zum Beispiel ist $2^4 = 2 \cdot 2 \cdot 2 \cdot 2 = 16$.
  - type: section
    id: funktionen-darstellung
    title: Darstellungen von Funktionen
    blocks:
      - type: text
        text: |
          Dieselbe Funktion kannst du auf drei Arten zeigen: als **Funktionsgleichung** (der Term), als
          **Wertetabelle** und als **Graph**. Aus dem Term rechnest du die Tabelle aus, die Punkte der Tabelle ergeben
          den Graphen.
      - type: example
        title: f(x) = x² + 1
        blocks:
          - type: text
            text: |
              Für $x = −1, 0, 1, 2$ ergeben sich die Werte 2, 1, 2 und 5. Die Punkte (−1 | 2), (0 | 1), (1 | 2) und
              (2 | 5) liegen auf dem Graphen.
      - type: vue-component
        id: test-funktionen-darstellung
        component: Kurztest
        props:
          question: "Eine Wertetabelle zeigt f(−2) = 7, f(0) = 3 und f(2) = 7. Welcher Term passt dazu?"
          options:
            - {
                text: "f(x) = x² + 3",
                correct: true,
                info: "Bei x = 0 ist der Wert 3, und bei −2 und 2 ist (±2)² = 4, also 4 + 3 = 7.",
              }
            - {
                text: "f(x) = 2x + 3",
                correct: false,
                info: "Bei x = 2 stimmt der Wert 7, aber bei x = −2 kommt −1 heraus.",
              }
            - {
                text: "f(x) = 3x + 1",
                correct: false,
                info: "Bei x = 2 stimmt der Wert 7, aber bei x = 0 kommt 1 heraus, nicht 3.",
              }
            - { text: "f(x) = x² + 7", correct: false, info: "Bei x = 0 kommt 7 heraus, nicht 3." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Eine Wertetabelle zeigt f(−2) = 7, f(0) = 3 und f(2) = 7. Welcher Term passt? Antwort: f(x) = x² + 3.
          Bei x = 0 ist der Wert 3, bei −2 und 2 ist 4 + 3 = 7. Falsch sind f(x) = 2x + 3 (bei x = −2 kommt −1
          heraus), f(x) = 3x + 1 (bei x = 0 kommt 1 heraus) und f(x) = x² + 7 (bei x = 0 kommt 7 heraus).
      - type: text
        text: "Wenn du unsicher warst: Wiederhole den Baustein „Darstellungen von Funktionen“ auf seiner [Kartenseite](https://lernapps.net/apps/map/mathematik/c/funktionen-darstellung/)."
      - type: definition
        term: Wertetabelle
        explanation: Eine Tabelle mit Zahlen $x$ und den zugehörigen Funktionswerten $f(x)$. Zum Beispiel gehört zu $f(x) = x^2$ die Zeile $x = 3$ und $f(x) = 9$.
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - lineare Funktionen mit Gleichung, Tabelle und Graph beschreiben und Steigung und Achsenabschnitt deuten kannst,
          - Klammern auflösen und die binomischen Formeln vorwärts und rückwärts anwenden kannst,
          - die Potenzgesetze für natürliche Exponenten anwenden kannst,
          - zwischen Funktionsgleichung, Wertetabelle und Graph wechseln kannst.
