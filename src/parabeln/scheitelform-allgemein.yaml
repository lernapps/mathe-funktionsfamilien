# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Scheitelform und allgemeine Form
description: "Zwei Terme für dieselbe Parabel: Die Scheitelform zeigt den Scheitel, die allgemeine Form den Schnittpunkt mit der y-Achse. Du wandelst sie ineinander um."
competencies: [quadratische-funktionen]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du kannst danach eine Parabel in zwei Formen schreiben und die eine in die andere umrechnen. Auf der Seite
          vorher hast du die Scheitelform $f(x) = a \cdot (x - d)^2 + e$ mit Reglern bewegt. Hier siehst du, wie
          derselbe Graph aussieht, wenn du die Klammer ausmultiplizierst.
  - type: section
    id: modell
    title: Eine Kurve, zwei Terme
    blocks:
      - type: text
        text: |
          Die **Scheitelform** $a \cdot (x - d)^2 + e$ verrät den Scheitel (d | e). Die **allgemeine Form**
          $a x^2 + b x + c$ entsteht durch Ausmultiplizieren. Dort ist $c$ der Wert bei $x = 0$, also der
          Schnittpunkt mit der y-Achse, und $b$ der **Mittelterm** (nicht der Achsenabschnitt einer Geraden). Unter dem Term mit den Reglern steht die ausmultiplizierte Form.
      - type: vue-component
        id: regler-zwei-formen
        component: FunktionsGraph
        props:
          family: quadratic
          allgemein: true
          regler:
            - { key: a, label: "a: strecken und spiegeln", min: -3, max: 3, step: 1, start: 1 }
            - { key: d, label: "d: nach rechts oder links", min: -4, max: 4, step: 1, start: 2 }
            - { key: e, label: "e: nach oben oder unten", min: -4, max: 4, step: 1, start: 1 }
          fenster: { xmin: -6, xmax: 6, ymin: -6, ymax: 14 }
          tabelleX: [-3, -2, -1, 0, 1, 2, 3]
          labels:
            graph: Graph der Parabel
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Normalparabel zum Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
            allgemein: "ausgerechnet:"
        nojs: |
          Graph mit Reglern für die Scheitelform $f(x) = a \cdot (x - d)^2 + e$ und die ausgerechnete allgemeine Form.
          Beim Start ist $a = 1$, $d = 2$, $e = 1$: $f(x) = (x - 2)^2 + 1 = x^2 - 4x + 5$. Der Scheitel ist (2 | 1),
          bei $x = 0$ ist der Wert 5. Mit $d = 0$ und $e = 3$ ist $f(x) = x^2 + 3$. Mit $a = 2$, $d = −1$, $e = 0$ ist
          $f(x) = 2 \cdot (x + 1)^2 = 2x^2 + 4x + 2$.
      - type: text
        text: |
          **Probiere es aus** (mit Reglern, dafür brauchst du JavaScript). Stelle die Regler so ein, dass die
          ausgerechnete Form am Ende $x^2 - 6x + 11$ heißt. Welche Werte haben $d$ und $e$?
  - type: section
    id: beispiel
    title: Hin und zurück rechnen
    blocks:
      - type: example
        title: Von der Scheitelform zur allgemeinen Form
        blocks:
          - type: formula
            formula: "f(x) = (x - 2)^2 + 1"
          - type: formula
            formula: "= x^2 - 4x + 4 + 1"
          - type: formula
            formula: "= x^2 - 4x + 5"
          - type: text
            text: Die binomische Formel gibt den Mittelterm $−4x$ und das Quadrat $+4$. Dazu kommt das $+1$.
      - type: example
        title: Von der allgemeinen Form zur Scheitelform (a = 1)
        blocks:
          - type: text
            text: |
              Aus $(x - d)^2 + e = x^2 - 2dx + d^2 + e$ folgt: Der Mittelterm $b$ ist $−2d$, die Zahl $c$ ist
              $d^2 + e$. Also ist $d = −\frac{b}{2}$ und $e = c - d^2$. Ist $a \neq 1$, klammerst du zuerst $a$ aus. Die Aufgaben hier haben $a = 1$.
          - type: formula
            formula: 'x^2 - 6x + 11: \quad d = 3'
          - type: formula
            formula: "e = 11 - 3^2 = 2"
          - type: formula
            formula: "f(x) = (x - 3)^2 + 2"
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: definition
        term: Mittelterm
        explanation: Der Summand in der Mitte, wenn du eine Klammer wie $(x - 3)^2$ ausmultiplizierst. Hier ist es $−6x$.
      - type: single-choice
        id: ausmultiplizieren
        text: Welche allgemeine Form hat $f(x) = (x + 1)^2 - 4$?
        options:
          - text: x² + 2x + 5
            correct: false
            info: "Die Zahl −4 wird addiert, nicht abgezogen: $1 + (−4) = −3$."
          - text: x² + 2x − 3
            correct: true
            info: "$(x + 1)^2 = x^2 + 2x + 1$, dazu kommt −4: $1 - 4 = −3$."
          - text: x² − 3
            correct: false
            info: Es fehlt der Mittelterm $2x$ der binomischen Formel.
          - text: x² − 2x − 3
            correct: false
            info: "Bei $(x + 1)^2$ ist der Mittelterm $+2x$, nicht $−2x$."
        explanation: Erst die Klammer mit der binomischen Formel auflösen, dann die Zahl am Ende dazurechnen.
      - type: generated
        id: mittelterm
        given:
          r: { pick: 1, from: { data: scheitelformen } }
        task:
          text: "Die Parabel hat die Scheitelform $f(x) = (x - {{r.d}})^2 + {{r.e}}$. Multipliziere aus: $f(x) = x^2 + b x + c$. Wie groß ist $b$?"
        answer: { value: "r.p", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r.d",
              message: "Der Mittelterm ist doppelt so groß und hat das Vorzeichen der Zahl in der Klammer, aber umgekehrt: Er ist −2 mal die Zahl in der Klammer.",
            }
          - { value: "r.b", message: "Das Vorzeichen fehlt: Bei (x − {{r.d}})² ist der Mittelterm negativ." }
          - { value: "0 - r.d", message: "Der Faktor 2 fehlt: Die binomische Formel gibt −2 · x · {{r.d}}." }
        hint: Die binomische Formel (x − d)² = x² − 2 · d · x + d² gibt den Mittelterm.
        steps:
          - "Mittelterm: $−2 \\cdot {{r.d}} \\cdot x = {{r.p}} x$"
          - "Also ist $b = {{answer}}$."
      - type: generated
        id: absolutglied
        given:
          r: { pick: 1, from: { data: scheitelformen } }
        task:
          text: "Die Parabel hat die Scheitelform $f(x) = (x - {{r.d}})^2 + {{r.e}}$. Multipliziere aus: $f(x) = x^2 + b x + c$. Wie groß ist $c$?"
        answer: { value: "r.c", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r.e",
              message: "Das ist nur die Zahl am Ende der Scheitelform. Das Quadrat der Zahl in der Klammer kommt noch dazu.",
            }
          - {
              value: "r.d + r.e",
              message: "Die Zahl in der Klammer wird quadriert, nicht einfach addiert: {{r.d}}² und nicht {{r.d}}.",
            }
        hint: Die binomische Formel gibt das letzte Glied d². Dazu kommt e.
        steps:
          - "Quadrat: ${{r.d}}^2 = {{r.dd}}$"
          - "Dazu die Zahl am Ende: ${{r.dd}} + {{r.e}} = {{r.c}}$, also $c = {{answer}}$."
      - type: generated
        id: scheitelform-finden
        given:
          r: { pick: 1, from: { data: scheitelformen } }
        task:
          text: "Eine Parabel hat die allgemeine Form $f(x) = x^2 - {{r.b}}x + {{r.c}}$. Schreibe sie als $f(x) = (x - d)^2 + e$. Wie groß ist $e$?"
        answer: { value: "r.e", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r.c",
              message: "Das ist die Zahl c der allgemeinen Form. Davon musst du noch das Quadrat von d abziehen.",
            }
          - { value: "r.c - r.d", message: "Es wird das Quadrat von d abgezogen, nicht d selbst." }
        hint: "Der Mittelterm ist −2d, also ist d die Hälfte der Zahl vor dem x. Dann ist e gleich c minus d im Quadrat."
        steps:
          - "$d$ ist die Hälfte von {{r.b}}: $d = {{r.d}}$."
          - "$e = {{r.c}} - {{r.d}}^2 = {{r.c}} - {{r.dd}} = {{r.e}}$."
      - type: true-false
        id: dieselbe-kurve
        text: Die Terme $f(x) = x^2 - 4x + 5$ und $f(x) = (x - 2)^2 + 1$ beschreiben dieselbe Parabel.
        answer: true
        explanation: "Ausmultipliziert ist $(x - 2)^2 + 1 = x^2 - 4x + 4 + 1 = x^2 - 4x + 5$. Beide Terme geben für jedes $x$ denselben Wert, zum Beispiel bei $x = 0$ die 5."
