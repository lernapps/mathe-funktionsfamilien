# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Potenz- und Wurzelfunktionen
description: "Weitere Mitglieder der Funktionsfamilie: Potenzfunktionen x³, x⁴, die Kehrwertfunktion 1 : x und die Wurzelfunktion √x mit ihren Graphen."
competencies: [potenzfunktionen]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Wenn du Zusammenhänge beschreiben willst, die nicht wie eine Parabel verlaufen, etwa das Volumen eines Würfels oder eine Größe, die kleiner wird, wenn die andere wächst, brauchst du weitere Funktionen der Familie.

          Du kannst danach sagen, wie die Graphen von $x^3$, $x^4$, $1 : x$ und $\sqrt{x}$ aussehen und für welche
          $x$ sie definiert sind. **Definiert** heißt: Du kannst den Funktionswert ausrechnen. Die Normalparabel $x^2$ kennst du schon. Sie ist die Potenzfunktion mit Exponent 2.
          Jetzt bewegst du den Exponenten selbst.
  - type: section
    id: modell
    title: Der Exponent als Regler
    blocks:
      - type: text
        text: |
          Wenn du wissen willst, was der Exponent mit der Kurve macht, bewege ihn.

          Eine **Potenzfunktion** hat den Term $f(x) = a \cdot x^n$ mit einer natürlichen Zahl $n \ge 1$. Der Regler $n$ ist der
          Exponent, der Regler $a$ streckt und spiegelt wie bei der Parabel. Term, Tabelle und Graph gehören wieder
          zusammen.
      - type: vue-component
        id: regler-potenz
        component: FunktionsGraph
        props:
          family: power
          regler:
            - { key: n, label: "n: Exponent", min: 1, max: 5, step: 1, start: 3 }
            - { key: a, label: "a: strecken und spiegeln", min: -2, max: 2, step: 1, start: 1 }
          fenster: { xmin: -3, xmax: 3, ymin: -8, ymax: 8 }
          tabelleX: [-2, -1, 0, 1, 2]
          labels:
            graph: Graph der Potenzfunktion
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph der Potenzfunktion $f(x) = a \cdot x^n$ mit Reglern für $n$ (1 bis 5) und $a$ (−2 bis 2). Beim Start ist
          $n = 3$, $a = 1$: $f(x) = x^3$ mit den Werten (−2 | −8), (−1 | −1), (0 | 0), (1 | 1), (2 | 8). Für gerades $n$
          (2, 4) ist die Kurve wie die Parabel nach oben geöffnet und liegt symmetrisch zur y-Achse. Für ungerades $n$
          (1, 3, 5) kommt sie von links unten und geht nach rechts oben.
      - type: text
        text: |
          **Probiere es aus** (mit Reglern, dafür brauchst du JavaScript). Stelle $n$ nacheinander auf 1, 2, 3, 4 und 5.
          Was ist bei geraden und ungeraden Zahlen anders? Schau auf die Tabelle bei $x = −2$ und $x = 2$.
  - type: section
    id: kehrwert-wurzel
    title: Kehrwert und Wurzel
    blocks:
      - type: text
        text: |
          Wenn du Funktionen benutzen willst, die für manche Zahlen keinen Wert haben, musst du wissen, wo sie definiert sind.

          Zwei weitere Mitglieder haben eine Lücke: Bei $f(x) = a : x$ darfst du nicht durch null teilen, bei
          $f(x) = a \cdot \sqrt{x}$ darfst du keine negative Zahl unter die Wurzel schreiben. Die Tabelle zeigt dort
          „nicht definiert“.
      - type: vue-component
        id: regler-kehrwert
        component: FunktionsGraph
        props:
          family: reciprocal
          regler:
            - { key: a, label: "a: strecken und spiegeln", min: -3, max: 3, step: 1, start: 1 }
          fenster: { xmin: -4, xmax: 4, ymin: -6, ymax: 6 }
          tabelleX: [-2, -1, 0, 1, 2]
          labels:
            graph: Graph der Kehrwertfunktion
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph der Kehrwertfunktion $f(x) = a : x$ mit Regler für $a$. Beim Start ist $a = 1$: Werte (−2 | −0,5),
          (−1 | −1), (0 | nicht definiert), (1 | 1), (2 | 0,5). Der Graph hat zwei Äste, einen im ersten und einen im dritten Quadranten des Koordinatensystems (für a > 0). Er berührt die Achsen nie.
      - type: vue-component
        id: regler-wurzel
        component: FunktionsGraph
        props:
          family: root
          regler:
            - { key: a, label: "a: strecken und spiegeln", min: -2, max: 2, step: 1, start: 1 }
          fenster: { xmin: -2, xmax: 9, ymin: -5, ymax: 5 }
          tabelleX: [-1, 0, 1, 4, 9]
          labels:
            graph: Graph der Wurzelfunktion
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph der Wurzelfunktion $f(x) = a \cdot \sqrt{x}$ mit Regler für $a$. Beim Start ist $a = 1$: Werte
          (−1 | nicht definiert), (0 | 0), (1 | 1), (4 | 2), (9 | 3). Der Graph beginnt im Ursprung und steigt nach
          rechts immer langsamer.
  - type: section
    id: beispiel
    title: Die Familie im Überblick
    blocks:
      - type: text
        text: "Wenn du vier Funktionen auseinanderhalten willst, hilft ein Blick darauf, wofür sie definiert sind und wie sie verlaufen."
      - type: table
        caption: Vier Mitglieder der Funktionsfamilie
        header: [Funktion, Definiert für, Verlauf]
        rows:
          - ["$x^3$", alle x, steigt von links unten nach rechts oben]
          - ["$x^4$", alle x, "wie die Parabel, aber nahe 0 flacher und weiter außen steiler, symmetrisch zur y-Achse"]
          - ["$1 : x$", "alle x außer 0", "zwei Äste, bei positivem a einer im ersten und einer im dritten Quadranten"]
          - ["$\\sqrt{x}$", "x größer oder gleich 0", "beginnt im Ursprung, steigt immer langsamer"]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: ungerade-potenz
        text: Welche Aussage über $f(x) = x^3$ stimmt?
        options:
          - text: f(−2) = 8
            correct: false
            info: Das gilt für gerade Exponenten wie bei $x^2$ oder $x^4$. Bei $x^3$ wird ein Produkt aus drei negativen Faktoren negativ.
          - text: f(−2) = −6
            correct: false
            info: "Das wäre $3 \\cdot (−2)$. Der Exponent 3 heißt aber: dreimal den Faktor −2 malnehmen."
          - text: f(−2) ist nicht definiert
            correct: false
            info: Die Potenzfunktion mit natürlichem Exponenten $n \ge 1$ ist für alle $x$ definiert.
          - text: f(−2) = −8
            correct: true
            info: Bei ungeradem Exponenten bleibt das Vorzeichen, $(−2)^3 = −8$. Die Kurve liegt links der y-Achse unten.
        explanation: Gerade Exponenten ergeben nie negative Werte, ungerade Exponenten behalten das Vorzeichen von $x$.
      - type: generated
        id: ungerade-potenz-rechnen
        given:
          n: { oneOf: [3, 5] }
          x: { oneOf: [-1, -2, -3] }
        task:
          text: "Berechne $f(x) = x^{{{n}}}$ an der Stelle $x = {{x}}$."
        answer: { value: "pow(x, n)", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "0 - pow(x, n)",
              message: "Das Vorzeichen stimmt nicht: Bei ungeradem Exponenten bleibt eine negative Zahl negativ.",
            }
          - {
              value: "x * n",
              message: "Der Exponent heißt nicht mal, sondern sagt, wie oft die Zahl als Faktor vorkommt.",
            }
        hint: Schreibe die Potenz als Produkt mit gleichen Faktoren und rechne Schritt für Schritt.
        steps:
          - "$({{x}})^{{{n}}}$ heißt {{n}} gleiche Faktoren $({{x}})$."
          - "Das Ergebnis ist $({{x}})^{{{n}}} = {{answer}}$."
      - type: generated
        id: kehrwert-rechnen
        given:
          x: { oneOf: [2, 4, 5, 10, 20, 25] }
        task:
          text: "Gegeben ist $f(x) = 1 : x$. Berechne $f({{x}})$ als Dezimalzahl."
        answer: { value: "1 / x", compare: { number: { format: decimal, decimals: 2 } } }
        mistakes:
          - { value: "x", message: "Das ist die Zahl selbst. Bei 1 : x wird 1 durch die Zahl geteilt." }
          - { value: "1 - x", message: "Es wird nicht abgezogen, sondern geteilt: 1 : {{x}}." }
        hint: "Teile 1 durch die Zahl. Das Ergebnis ist eine Dezimalzahl."
        steps:
          - "$f({{x}}) = 1 : {{x}} = {{answer}}$"
      - type: generated
        id: wurzel-rechnen
        given:
          x: { oneOf: [9, 16, 25, 36, 49] }
          a: { oneOf: [2, 3] }
        task:
          text: "Gegeben ist $f(x) = {{a}} \\cdot \\sqrt{x}$. Berechne $f({{x}})$."
        answer: { value: "a * sqrt(x)", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "a * x / 2",
              message: "Die Wurzel ist nicht die Hälfte. √{{x}} ist die Zahl, die mit sich selbst malgenommen {{x}} ergibt.",
            }
          - {
              value: "sqrt(a * x)",
              message: "Der Faktor {{a}} steht vor der Wurzel, nicht darunter: erst die Wurzel ziehen, dann mal {{a}}.",
            }
        hint: Ziehe zuerst die Wurzel und multipliziere dann mit der Zahl vor der Wurzel.
        steps:
          - "$\\sqrt{{{x}}}$ ist die Zahl, die mit sich selbst {{x}} ergibt."
          - "$f({{x}}) = {{a}} \\cdot \\sqrt{{{x}}} = {{answer}}$"
      - type: multiple-choice
        id: luecken
        text: Welche Funktionen sind nicht für alle Zahlen $x$ definiert? Wähle alle richtigen.
        options:
          - text: f(x) = x³
            correct: false
            info: Potenzen mit natürlichem Exponenten wie x³ kannst du für jede Zahl ausrechnen.
          - text: f(x) = x⁴
            correct: false
            info: Auch negative $x$ gehen, denn $(−2)^4 = 16$.
          - text: "f(x) = 1 : x"
            correct: true
            info: Durch null darf man nicht teilen, $x = 0$ ist ausgeschlossen.
          - text: f(x) = √x
            correct: true
            info: Unter der Wurzel darf keine negative Zahl stehen, es muss $x \ge 0$ sein.
        explanation: Ein Ausschluss entsteht beim Teilen durch null und beim Wurzelziehen aus negativen Zahlen.
