# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Normalparabel und Regler
description: "Die Normalparabel mit drei Reglern verschieben, strecken und spiegeln: Term, Tabelle und Graph gehören zusammen."
competencies: [quadratische-funktionen]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du kannst danach sagen, was mit der Kurve passiert, wenn du an einer Zahl im Term drehst, und du kannst
          Term und Kurve einander zuordnen. Lineare Funktionen kennst du schon: Term, Tabelle und Graph gehören
          zusammen. Hier kommt eine gebogene Kurve dazu.
      - type: figure
        image: images/normalparabel.svg
        alt: "Der Graph von f(x) = x²: eine nach oben geöffnete Kurve mit dem tiefsten Punkt im Ursprung, bei x = 2 und x = −2 liegt sie bei y = 4."
        caption: Die Normalparabel zu f(x) = x². Ihr tiefster Punkt heißt Scheitel.
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: definition
        term: Normalparabel
        explanation: Der Graph der Funktion $f(x) = x^2$. Sie ist nach oben geöffnet und hat ihren Scheitel im Ursprung.
      - type: definition
        term: Scheitel
        explanation: Der tiefste oder höchste Punkt einer Parabel. Bei der Normalparabel ist er der Punkt (0 | 0).
  - type: section
    id: modell
    title: Term, Tabelle und Graph mit Reglern
    blocks:
      - type: text
        text: |
          Der Term $f(x) = a \cdot (x - d)^2 + e$ beschreibt eine ganze Familie von Parabeln. Die drei Zahlen
          $a$, $d$ und $e$ sind die Regler. Wenn du einen Regler bewegst, ändern sich der Term, die Tabelle und die
          Kurve gleichzeitig. Die gestrichelte Kurve ist zum Vergleich immer die Normalparabel.
      - type: vue-component
        id: regler-normalparabel
        component: FunktionsGraph
        props:
          family: quadratic
          regler:
            - { key: a, label: "a: strecken und spiegeln", min: -3, max: 3, step: 0.5, start: 1 }
            - { key: d, label: "d: nach rechts oder links", min: -4, max: 4, step: 1, start: 0 }
            - { key: e, label: "e: nach oben oder unten", min: -4, max: 4, step: 1, start: 0 }
          fenster: { xmin: -6, xmax: 6, ymin: -6, ymax: 10 }
          tabelleX: [-3, -2, -1, 0, 1, 2, 3]
          grundform:
            - { key: a, value: 1 }
            - { key: d, value: 0 }
            - { key: e, value: 0 }
          labels:
            graph: Graph der Parabel
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Normalparabel zum Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph mit Reglern: Term $f(x) = a \cdot (x - d)^2 + e$. Ohne Regler ist $a = 1$, $d = 0$, $e = 0$, also die
          Normalparabel $f(x) = x^2$ mit den Werten (−3 | 9), (−2 | 4), (−1 | 1), (0 | 0), (1 | 1), (2 | 4), (3 | 9).
          Mit $e = 2$ liegen alle Werte um 2 höher: der Scheitel ist (0 | 2). Mit $d = 2$ wird die Kurve um 2 nach
          rechts geschoben: $f(x) = (x - 2)^2$ hat den Scheitel (2 | 0). Mit $a = −1$ ist die Kurve an der x-Achse
          gespiegelt und nach unten geöffnet, mit $a = 2$ ist sie doppelt so steil.
      - type: text
        text: |
          **Probiere es aus.** Bewege zuerst nur $e$, dann nur $d$, dann nur $a$. Achte darauf, an welchem Punkt der
          Scheitel liegt und wie sich die Zahlen in der Tabelle ändern.
  - type: section
    id: beispiel
    title: Was jeder Regler macht
    blocks:
      - type: table
        caption: Die drei Regler der Parabel
        header: [Regler, Wirkung, Beispiel]
        rows:
          - ["$e$", "schiebt die Kurve nach oben ($e > 0$) oder unten ($e < 0$)", "$x^2 + 2$: Scheitel (0 | 2)"]
          - ["$d$", "schiebt nach rechts ($d > 0$) oder links ($d < 0$)", "$(x - 2)^2$: Scheitel (2 | 0)"]
          - ["$a$", "streckt ($|a| > 1$), staucht ($|a| < 1$) oder spiegelt ($a < 0$)", "$−x^2$: nach unten geöffnet"]
      - type: example
        title: Warum verschiebt (x − 2)² nach rechts?
        blocks:
          - type: text
            text: |
              Der Scheitel ist dort, wo die Klammer null wird, denn ein Quadrat ist nie kleiner als 0. Bei
              $(x - 2)^2$ ist die Klammer null für $x = 2$. Der Scheitel liegt also bei $x = 2$, rechts vom
              Ursprung. Bei $(x + 2)^2 = (x - (−2))^2$ liegt er bei $x = −2$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: richtung-erkennen
        text: Wohin schiebt der Term $f(x) = (x - 3)^2$ die Normalparabel?
        options:
          - text: Um 3 nach rechts
            correct: true
            info: Die Klammer ist null für $x = 3$. Dort liegt der Scheitel.
          - text: Um 3 nach links
            correct: false
            info: "Das Minuszeichen täuscht: Bei $(x - 3)$ ist die Klammer für $x = 3$ null, der Scheitel liegt rechts vom Ursprung."
          - text: Um 3 nach oben
            correct: false
            info: Nach oben schiebt eine Zahl, die außerhalb der Klammer addiert wird, zum Beispiel $x^2 + 3$.
          - text: Um 3 nach unten
            correct: false
            info: Nach unten schiebt eine Zahl, die außerhalb der Klammer abgezogen wird, zum Beispiel $x^2 - 3$.
        explanation: Eine Zahl in der Klammer verschiebt waagerecht, aber mit umgekehrtem Vorzeichen. Eine Zahl außerhalb der Klammer verschiebt senkrecht.
      - type: vue-component
        id: parabel-einstellen
        component: FunktionsGraphAufgabe
        props:
          task: Stelle die drei Regler so ein, dass deine Parabel genau auf der gestrichelten Zielparabel liegt. Lies dazu den Scheitel und die Öffnung ab.
          sliderLabels: ["a: strecken und spiegeln", "d: nach rechts oder links", "e: nach oben oder unten"]
          mistakes:
            - "Die Parabel liegt auf der falschen Seite: Bei $(x - d)^2$ schiebt ein positives d nach rechts. Prüfe, wo der Scheitel der gestrichelten Kurve auf der x-Achse liegt (d = x-Wert des Scheitels)."
            - "Die Parabel liegt oben statt unten (oder umgekehrt): e ist der y-Wert des Scheitels."
            - "Die Öffnung stimmt nicht: Bei a < 0 ist die Parabel nach unten geöffnet, bei a > 0 nach oben."
          labels:
            graph: Graph der Parabel
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Zielparabel
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        examples:
          accepted:
            - { answer: { a: 0.5, d: -3, e: 1 }, seed: 1 }
          rejected:
            - { answer: { a: 1, d: 0, e: 0 } }
      - type: generated
        id: scheitel-ablesen
        given:
          d: { int: [1, 6] }
          e: { int: [7, 9] }
        task:
          text: "Eine Parabel hat den Term $f(x) = (x - {{d}})^2 + {{e}}$. Bei welchem x-Wert liegt ihr Scheitel?"
        answer: { value: "d", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "0 - d",
              message: "Das Vorzeichen ist umgekehrt: Die Klammer $(x - {{d}})$ ist null für $x = {{d}}$, der Scheitel liegt rechts vom Ursprung.",
            }
          - {
              value: "e",
              message: "Das ist der y-Wert des Scheitels. Gefragt ist der x-Wert, den liest du in der Klammer.",
            }
        hint: Der Scheitel liegt dort, wo die Klammer null wird.
        steps:
          - "Die Klammer ist null, wenn $x - {{d}} = 0$ ist."
          - "Das gilt für $x = {{answer}}$."
      - type: generated
        id: wert-berechnen
        given:
          a: { int: [2, 3] }
          d: { int: [1, 4] }
          e: { int: [1, 5] }
          x: { int: [6, 9] }
        task:
          text: "Gegeben ist $f(x) = {{a}} \\cdot (x - {{d}})^2 + {{e}}$. Berechne den Funktionswert an der Stelle $x = {{x}}$."
        answer: { value: "a * (x - d) * (x - d) + e", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "a * (x - d) + e",
              message: "Du hast die Klammer nicht quadriert. Erst $(x - {{d}})$ ausrechnen, dann quadrieren, dann mit {{a}} malnehmen.",
            }
          - {
              value: "(a * (x - d)) * (a * (x - d)) + e",
              message: "Das a gehört nicht in die Klammer, die quadriert wird: Erst quadrieren, dann mit {{a}} malnehmen.",
            }
        hint: Rechne in dieser Reihenfolge, Klammer, Quadrat, mal a, plus e.
        steps:
          - "$x - d = {{x}} - {{d}}$"
          - "Das Ergebnis der Klammer quadrieren, mit {{a}} malnehmen und {{e}} addieren."
      - type: true-false
        id: spiegeln
        text: Bei $f(x) = −2 \cdot x^2$ ist die Parabel nach unten geöffnet und steiler als die Normalparabel.
        answer: true
        explanation: Das Minuszeichen in $a = −2$ spiegelt an der x-Achse, der Betrag 2 macht die Kurve steiler.
