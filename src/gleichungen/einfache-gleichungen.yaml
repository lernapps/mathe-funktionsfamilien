# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Einfache quadratische Gleichungen
description: "Lösungen einer quadratischen Gleichung sind die Nullstellen der Parabel. Drei einfache Wege: Wurzelziehen, Ausklammern und Produkt gleich null."
competencies: [quadratische-gleichungen-einfach]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Eine Gleichung mit einem x² begegnet dir, sobald du wissen willst, wo ein Ball landet oder wo eine Brücke den Boden berührt.

          Du kannst danach einfache quadratische Gleichungen lösen und sagen, was ihre Lösungen am Graphen bedeuten.
          Bei einer **quadratischen Gleichung** kommt $x$ höchstens in der zweiten Potenz vor, und $x^2$ kommt wirklich vor, zum Beispiel $x^2 - 9 = 0$. Ihre
          Lösungen sind die **Nullstellen** der Parabel: die Stellen, an denen der Graph die x-Achse schneidet.
      - type: definition
        term: Nullstelle
        explanation: Eine Zahl $x$, für die der Funktionswert $f(x)$ gleich 0 ist. Am Graphen ist es ein Schnittpunkt mit der x-Achse.
  - type: section
    id: modell
    title: Nullstellen am Graphen
    blocks:
      - type: text
        text: |
          Wenn du sehen willst, wie viele Lösungen eine Gleichung hat, schau auf den Graphen.

          Der Graph zeigt $f(x) = x^2 + e$. Mit dem Regler $e$ schiebst du die Parabel nach oben und unten. Die
          Gleichung $x^2 + e = 0$ ist gelöst, wo die Kurve die x-Achse berührt oder schneidet. Es können zwei, eine
          oder keine Stellen sein. Ein Quadrat ist nie negativ: Zu $x^2 = −4$ gibt es keine Lösung.
      - type: vue-component
        id: regler-nullstellen
        component: FunktionsGraph
        props:
          family: quadratic
          fest:
            - { key: a, value: 1 }
            - { key: d, value: 0 }
          regler:
            - { key: e, label: "e: nach oben oder unten", min: -9, max: 4, step: 1, start: -4 }
          fenster: { xmin: -5, xmax: 5, ymin: -10, ymax: 10 }
          tabelleX: [-3, -2, -1, 0, 1, 2, 3]
          labels:
            graph: Graph der Parabel
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph von $f(x) = x^2 + e$ mit Regler für $e$ von −9 bis 4. Beim Start ist $e = −4$: Die Kurve schneidet die
          x-Achse bei x = −2 und x = 2 (Werte: (−2 | 0), (0 | −4), (2 | 0)). Bei $e = 0$ berührt sie die x-Achse nur im
          Ursprung. Bei $e = 3$ liegt sie ganz über der x-Achse und hat keine Nullstelle.
      - type: text
        text: |
          **Probiere es aus** (mit Reglern, dafür brauchst du JavaScript). Stelle $e$ so ein, dass es genau eine
          Nullstelle gibt, dann so, dass es keine gibt. Lies bei $e = −9$ die beiden Nullstellen ab.
  - type: section
    id: beispiel
    title: Drei Wege
    blocks:
      - type: text
        text: "Wenn du wissen willst, wo eine Parabel die x-Achse schneidet, suchst du eine Nullstelle. Alle drei Wege haben gemeinsam, dass man überlegt, wann eine Seite der Gleichung null werden kann."
      - type: example
        title: Wurzelziehen, wenn nur x² und eine Zahl dastehen
        blocks:
          - type: formula
            formula: 'x^2 - 9 = 0 \quad \Rightarrow \quad x^2 = 9'
          - type: text
            text: Dann ziehst du auf beiden Seiten die Wurzel und denkst an beide Vorzeichen, $x = 3$ oder $x = −3$.
      - type: example
        title: Ausklammern, wenn jeder Summand ein x enthält
        blocks:
          - type: formula
            formula: 'x^2 - 4x = 0 \quad \Rightarrow \quad x \cdot (x - 4) = 0'
          - type: text
            text: Ein Produkt ist null, wenn ein Faktor null ist. Also gilt $x = 0$ oder $x - 4 = 0$, das heißt $x = 0$ oder $x = 4$.
      - type: example
        title: Produkt gleich null, wenn die Gleichung schon als Produkt dasteht
        blocks:
          - type: formula
            formula: '(x - 2) \cdot (x + 5) = 0'
          - type: text
            text: Die Gleichung steht schon als Produkt da. Setze jeden Faktor gleich null, $x = 2$ oder $x = −5$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: weg-waehlen
        text: Welcher Weg löst $x^2 - 7x = 0$ am schnellsten?
        options:
          - text: Beide Seiten durch x teilen
            correct: false
            info: "Dabei geht die Lösung $x = 0$ verloren. Durch x darfst du nur teilen, wenn x nicht null sein kann."
          - text: Ausklammern von x
            correct: true
            info: Beide Summanden enthalten x. Aus $x \cdot (x - 7) = 0$ folgt $x = 0$ oder $x = 7$.
          - text: Wurzelziehen
            correct: false
            info: "Wurzelziehen geht nur, wenn die Gleichung die Form $x^2 = c$ hat. Hier steht noch ein $7x$ dabei."
        explanation: Wenn alle Summanden ein x enthalten, klammerst du es aus und nutzt, dass ein Produkt null ist, wenn ein Faktor null ist.
      - type: generated
        id: wurzelziehen
        given:
          r: { oneOf: [2, 3, 4, 5, 6, 7, 8, 9] }
        task:
          text: "Löse $x^2 = {{r}}^2$. Wie lautet die kleinere der beiden Lösungen?"
        answer: { value: "0 - r", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r",
              message: "Das ist die größere Lösung. Beim Wurzelziehen gibt es zwei Lösungen, die positive und die negative.",
            }
        hint: "Beide Vorzeichen: Die Quadratzahl hat zwei Wurzeln."
        steps:
          - "$x^2 = {{r}}^2$ hat die Lösungen $x = {{r}}$ und $x = −{{r}}$."
          - "Die kleinere Lösung ist $x = {{answer}}$."
      - type: generated
        id: ausklammern
        given:
          k: { int: [2, 9] }
        task:
          text: "Löse $x^2 - {{k}}x = 0$ durch Ausklammern. Wie lautet die größere der beiden Lösungen?"
        answer: { value: "k", compare: { number: { format: integer } } }
        mistakes:
          - { value: "0 - k", message: "Das Vorzeichen stimmt nicht: Aus x − {{k}} = 0 folgt x = {{k}}, nicht −{{k}}." }
          - {
              value: "k * k",
              message: "Wurzelziehen würde hier nicht gehen. Nach dem Ausklammern ist x · (x − {{k}}) = 0, und die zweite Lösung ist {{k}}.",
            }
        hint: "Klammere x aus. Dann ist ein Produkt gleich null."
        steps:
          - "$x \\cdot (x - {{k}}) = 0$"
          - "Ein Faktor ist 0: $x = 0$ oder $x - {{k}} = 0$, also $x = {{k}}$."
      - type: generated
        id: produkt-null
        given:
          p: { int: [1, 6] }
          q: { int: [2, 7] }
        where: ["p != q"]
        task:
          text: "Löse $(x - {{p}}) \\cdot (x + {{q}}) = 0$. Wie lautet die größere der beiden Lösungen?"
        answer: { value: "p", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "q",
              message: "Bei (x + {{q}}) ist der Faktor null für x = −{{q}}, nicht für x = {{q}}. Das Vorzeichen kehrt sich um.",
            }
          - { value: "0 - p", message: "Bei (x − {{p}}) ist der Faktor null für x = {{p}}, nicht für x = −{{p}}." }
        hint: "Setze jeden Faktor einzeln gleich null."
        steps:
          - "$x - {{p}} = 0$ gibt $x = {{p}}$."
          - "$x + {{q}} = 0$ gibt $x = −{{q}}$. Die größere Lösung ist {{p}}."
      - type: true-false
        id: keine-loesung
        text: Die Gleichung $x^2 = −4$ hat die Lösungen 2 und −2.
        answer: false
        explanation: Das Quadrat einer Zahl ist nie negativ. Die Parabel $f(x) = x^2 + 4$ liegt ganz über der x-Achse, die Gleichung hat keine Lösung.
      - type: multiple-choice
        id: zwei-loesungen
        text: "Welche Gleichungen haben genau zwei Lösungen? Wähle alle richtigen."
        options:
          - text: "x² = 0"
            correct: false
            info: Nur die Lösung 0. Die Parabel berührt die x-Achse in einem Punkt.
          - text: "x² = −9"
            correct: false
            info: Das Quadrat einer Zahl ist nie negativ, es gibt keine Lösung.
          - text: "x² = 25"
            correct: true
            info: Die Lösungen sind 5 und −5.
          - text: "(x − 1)(x + 1) = 0"
            correct: true
            info: Die Faktoren sind null für x = 1 und x = −1.
        explanation: Zwei Lösungen heißen zwei Schnittpunkte der Parabel mit der x-Achse.
