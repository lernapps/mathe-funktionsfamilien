# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Quadratische Gleichungen auf drei Wegen
description: "Quadratische Gleichungen am Graphen, mit einer Wertetabelle und mit Rechnung lösen: quadratische Ergänzung und Lösungsformel, und wie viele Lösungen es gibt."
competencies: [quadratische-gleichungen]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du kannst danach jede quadratische Gleichung in der Normalform $x^2 + px + q = 0$ lösen und vorher sagen, ob sie zwei, eine
          oder keine Lösung hat. Dafür gehst du drei Wege: am Graphen, mit einer Wertetabelle und durch Rechnen.
  - type: section
    id: modell
    title: Zwei, eine oder keine Lösung
    blocks:
      - type: text
        text: |
          Die Lösungen von $f(x) = 0$ sind die Nullstellen der Parabel. Verschiebe sie mit den Reglern und
          achte darauf, wie oft sie die x-Achse trifft.
      - type: vue-component
        id: regler-anzahl
        component: FunktionsGraph
        props:
          family: quadratic
          fest:
            - { key: a, value: 1 }
          regler:
            - { key: d, label: "d: nach rechts oder links", min: -4, max: 4, step: 1, start: 2 }
            - { key: e, label: "e: nach oben oder unten", min: -5, max: 5, step: 1, start: -1 }
          fenster: { xmin: -6, xmax: 6, ymin: -6, ymax: 10 }
          tabelleX: [-3, -2, -1, 0, 1, 2, 3]
          labels:
            graph: Graph der Parabel
            tabelle: Wertetabelle
            reset: Regler zurücksetzen
            grundform: Vergleich
            x: x
            y: f(x)
            undefinedValue: nicht definiert
        nojs: |
          Graph von $f(x) = (x - d)^2 + e$ mit Reglern für $d$ und $e$. Beim Start ist $d = 2$, $e = −1$: Die Kurve
          schneidet die x-Achse bei x = 1 und x = 3 (zwei Lösungen). Bei $e = 0$ berührt sie die Achse nur im
          Scheitel (eine Lösung). Bei $e = 1$ liegt sie ganz über der Achse (keine Lösung).
      - type: text
        text: |
          Der Scheitel liegt bei (d | e). Eine nach oben geöffnete Parabel hat zwei Nullstellen, wenn ihr Scheitel
          unter der x-Achse liegt, eine, wenn er darauf liegt, und keine, wenn er darüber liegt.
  - type: section
    id: ergaenzung
    title: Quadratische Ergänzung
    blocks:
      - type: text
        text: |
          Die **quadratische Ergänzung** macht aus $x^2 + 6x$ ein Quadrat. Im Rechteckmodell ist $x^2$ ein Quadrat und
          $6x$ besteht aus zwei Rechtecken mit den Seiten $x$ und 3. Zum großen Quadrat fehlt noch die Ecke $3 \cdot 3 = 9$.
      - type: figure
        image: images/quadratische-ergaenzung.svg
        alt: "Ein Quadrat mit der Seite x. Rechts daneben und darunter liegt je ein Rechteck mit den Seiten 3 und x. In der Ecke fehlt ein gestricheltes Quadrat mit der Seite 3 und der Fläche 9."
        caption: "Die gestrichelte Ecke 9 ergänzt x² + 6x zum Quadrat (x + 3)²."
        source: eigene Zeichnung
        licence: CC0-1.0
      - type: formula
        formula: "x^2 + 6x + 9 = (x + 3)^2"
      - type: text
        text: Du ergänzt immer das Quadrat der halben Zahl vor dem $x$. Bei einer Gleichung ergänzt du auf beiden Seiten dasselbe, damit sie gleich bleibt.
      - type: example
        title: x² + 6x − 7 = 0 mit quadratischer Ergänzung
        blocks:
          - type: text
            text: "Die Schritte: 7 auf beide Seiten addieren, das Quadrat der halben Zahl ergänzen, die binomische Formel rückwärts anwenden, die Wurzel ziehen, nach x auflösen."
          - type: formula
            formula: "x^2 + 6x = 7"
          - type: formula
            formula: "x^2 + 6x + 9 = 7 + 9"
          - type: formula
            formula: "(x + 3)^2 = 16"
          - type: text
            text: Dann ziehst du die Wurzel, $x + 3 = 4$ oder $x + 3 = −4$, also $x = 1$ oder $x = −7$.
      - type: definition
        term: Quadratische Ergänzung
        explanation: Das Ergänzen von $x^2 + px$ um das Quadrat der halben Zahl vor dem x, damit ein Quadrat einer Klammer entsteht. Aus $x^2 + 6x$ wird mit 9 das Quadrat $(x + 3)^2$.
  - type: section
    id: formel
    title: Die Lösungsformel
    blocks:
      - type: text
        text: |
          Wenn du die quadratische Ergänzung allgemein für $x^2 + px + q = 0$ machst, entsteht die **Lösungsformel**
          (auch p-q-Formel genannt):
      - type: formula
        formula: 'x = -\frac{p}{2} \pm \sqrt{\left(\frac{p}{2}\right)^2 - q}'
      - type: text
        text: |
          Der Term unter der Wurzel heißt **Diskriminante** $D = (\frac{p}{2})^2 - q$. Ist $D > 0$, gibt es zwei
          Lösungen, bei $D = 0$ eine und bei $D < 0$ keine, denn aus einer negativen Zahl kannst du keine Wurzel ziehen.
      - type: definition
        term: Lösungsformel
        explanation: Die Formel, die für $x^2 + px + q = 0$ die Lösungen liefert. Sie heißt auch p-q-Formel.
      - type: definition
        term: Diskriminante
        explanation: Der Term unter der Wurzel der Lösungsformel. Sein Vorzeichen entscheidet, ob es zwei, eine oder keine Lösung gibt.
  - type: section
    id: beispiel
    title: Dieselbe Gleichung auf drei Wegen
    blocks:
      - type: example
        title: x² − 6x + 5 = 0
        blocks:
          - type: text
            text: "**Grafisch:** Stelle im ersten Abschnitt oben die Regler auf $d = 3$ und $e = −4$. Das ist die Scheitelform $(x - 3)^2 - 4$, ausmultipliziert $x^2 - 6x + 5$. Der Graph schneidet die x-Achse bei $x = 1$ und $x = 5$."
          - type: table
            caption: "Numerisch: Wertetabelle von f(x) = x² − 6x + 5"
            header: [x, f(x)]
            rows:
              - ["0", "5"]
              - ["1", "0"]
              - ["3", "−4"]
              - ["5", "0"]
              - ["6", "5"]
          - type: text
            text: "**Algebraisch:** Mit $p = −6$ und $q = 5$ ist $D = 3^2 - 5 = 4$ und $x = 3 \\pm 2$, also $x = 5$ oder $x = 1$. Alle drei Wege geben dieselben Lösungen."
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: ergaenzung-zahl
        text: Welche Zahl ergänzt x² + 8x zu einem Quadrat?
        options:
          - text: "64"
            correct: false
            info: Das ist 8². Ergänzt wird aber das Quadrat der Hälfte von 8, also 4².
          - text: "4"
            correct: false
            info: Das ist die Hälfte von 8. Sie steht in der Klammer, ergänzt wird ihr Quadrat.
          - text: "16"
            correct: true
            info: "Die Hälfte von 8 ist 4, und 4² = 16. Es ist x² + 8x + 16 = (x + 4)²."
          - text: "8"
            correct: false
            info: Das ist die Zahl vor dem x selbst. Ergänzt wird das Quadrat ihrer Hälfte.
        explanation: Zur quadratischen Ergänzung brauchst du die Hälfte der Zahl vor dem x und davon das Quadrat.
      - type: generated
        id: formel-anwenden
        given:
          r: { pick: 1, from: { data: gleichungen } }
        task:
          text: "Löse $x^2 - {{r.b}}x + {{r.q}} = 0$ mit der Lösungsformel. Wie lautet die größere der beiden Lösungen?"
        answer: { value: "r.x2", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r.x1",
              message: "Das ist die kleinere Lösung, mit minus vor der Wurzel. Gefragt ist die größere, mit plus.",
            }
          - { value: "r.m", message: "Das ist nur −p : 2. Die Wurzel der Diskriminante wird noch dazugerechnet." }
          - { value: "r.s", message: "Das ist nur die Wurzel. Davor steht noch −p : 2, hier also {{r.m}}." }
        hint: "Setze p und q ein: p ist die Zahl vor x mit ihrem Vorzeichen, q die Zahl am Ende."
        steps:
          - "$−\\frac{p}{2} = {{r.m}}$ und $D = {{r.mm}} - {{r.q}} = {{r.diskr}}$"
          - "$x = {{r.m}} \\pm \\sqrt{{{r.diskr}}} = {{r.m}} \\pm {{r.s}}$"
          - "Die Lösungen sind {{r.x1}} und {{r.x2}}. Die größere ist {{answer}}."
      - type: generated
        id: anzahl-loesungen
        given:
          r: { pick: 1, from: { data: anzahl-loesungen } }
        task:
          text: "Wie viele Lösungen hat $x^2 - {{r.b}}x + {{r.q}} = 0$? Gib 0, 1 oder 2 an."
        answer: { value: "r.anzahl", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "r.anzahl + 1",
              message: "Du hast eine Lösung zu viel gezählt: Prüfe das Vorzeichen der Diskriminante.",
            }
        hint: "Rechne D = (p : 2)² − q aus. Dann entscheidet das Vorzeichen."
        steps:
          - "$p = −{{r.b}}$, also $\\frac{p}{2}$ im Quadrat ist {{r.mm}}."
          - "$D = {{r.mm}} - {{r.q}} = {{r.dtext}}$"
          - "Mit diesem D gibt es {{answer}} Lösungen."
      - type: ordering
        id: ergaenzung-schritte
        text: "Löse x² + 6x − 7 = 0 mit der quadratischen Ergänzung. Bringe die Schritte in die richtige Reihenfolge."
        items:
          - "7 auf beide Seiten addieren: x² + 6x = 7"
          - "Das Quadrat der Hälfte von 6 ergänzen: x² + 6x + 9 = 16"
          - "Binomische Formel rückwärts: (x + 3)² = 16"
          - "Wurzel ziehen: x + 3 = 4 oder x + 3 = −4"
          - "Nach x auflösen: x = 1 oder x = −7"
        explanation: Erst die Zahl auf die rechte Seite, dann auf beiden Seiten das Quadrat der halben Zahl vor x ergänzen, die linke Seite als Quadrat schreiben, die Wurzel ziehen und nach x auflösen.
      - type: true-false
        id: negative-diskriminante
        text: Ist die Diskriminante einer quadratischen Gleichung negativ, dann schneidet die zugehörige nach oben geöffnete Parabel die x-Achse nicht.
        answer: true
        explanation: Keine Lösung heißt keine Nullstelle. Der Scheitel liegt dann über der x-Achse und die Parabel öffnet sich nach oben, ohne sie zu treffen.
      - type: single-choice
        id: wege-vergleichen
        text: "Du hast die Gleichung x² − 4x + 3 = 0 gelöst. Welche Lösungen passen zur Wertetabelle mit f(1) = 0 und f(3) = 0?"
        options:
          - text: "x = −1 und x = −3"
            correct: false
            info: "Bei x = −1 ist f(−1) = 1 + 4 + 3 = 8, nicht 0. Das Vorzeichen der Lösungen ist umgekehrt."
          - text: "x = 4 und x = 3"
            correct: false
            info: "Die 4 steht nur als Zahl in der Gleichung. Bei x = 4 ist f(4) = 3, nicht 0."
          - text: "x = 1 und x = 3"
            correct: true
            info: In der Tabelle ist f(x) bei x = 1 und x = 3 gleich 0. Das sind die Nullstellen.
        explanation: Aus der Wertetabelle liest du die Lösungen ab, wo f(x) = 0 ist. Die Rechnung mit der Formel liefert dasselbe.
