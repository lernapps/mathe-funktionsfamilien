<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Skizze der Komponente FunktionsGraph: oben Term, links Graph mit Parabel, rechts Wertetabelle, unten drei Regler a, d, e">
<rect width="520" height="300" fill="none" stroke="#666"/>
<text x="20" y="28" font-size="16" font-family="sans-serif">f(x) = a · (x − d)² + e   mit a = 1, d = 0, e = 0</text>
<rect x="20" y="40" width="300" height="170" fill="none" stroke="#666"/>
<line x1="20" y1="170" x2="320" y2="170" stroke="#666"/><line x1="170" y1="40" x2="170" y2="210" stroke="#666"/>
<path d="M110 50 Q170 290 230 50" fill="none" stroke="#06c" stroke-width="2"/>
<text x="340" y="55" font-size="13" font-family="sans-serif">x | f(x)</text>
<text x="340" y="80" font-size="13" font-family="sans-serif">−2 | 4</text><text x="340" y="100" font-size="13" font-family="sans-serif">−1 | 1</text><text x="340" y="120" font-size="13" font-family="sans-serif">0 | 0</text><text x="340" y="140" font-size="13" font-family="sans-serif">1 | 1</text><text x="340" y="160" font-size="13" font-family="sans-serif">2 | 4</text>
<text x="20" y="235" font-size="13" font-family="sans-serif">a (strecken, spiegeln)  ──●──  1</text>
<text x="20" y="258" font-size="13" font-family="sans-serif">d (nach rechts/links)   ──●──  0</text>
<text x="20" y="281" font-size="13" font-family="sans-serif">e (nach oben/unten)    ──●──  0     [Zurücksetzen]</text>
</svg>
